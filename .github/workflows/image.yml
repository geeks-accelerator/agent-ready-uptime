# Builds the runner's Docker image and pushes it to ghcr.io/geeks-accelerator/agent-ready-uptime
# with the repository's own token: on a release tagged v<version> (tagged with the version
# and latest), or by hand (latest only).
name: Image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # only this job pushes the image
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          tags="ghcr.io/${GITHUB_REPOSITORY}:latest"
          case "$GITHUB_REF_NAME" in v*) tags="$tags,ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Agent-ready uptime monitoring
            org.opencontainers.image.licenses=MIT
