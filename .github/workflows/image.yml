# Builds the runner's Docker image and pushes it to ghcr.io/geeks-accelerator/agent-ready-uptime
# with the repository's own token, for x86 and ARM (Apple Silicon, Graviton): on a release
# tagged v<version> (tagged with the version and latest), or by hand (latest, plus a version
# when one is given, e.g. to rebuild a release's image).
name: Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Also tag the image with this version (e.g. 0.1.1)"
        required: false

permissions:
  contents: read

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # only this job pushes the image
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tags="ghcr.io/${GITHUB_REPOSITORY}:latest"
          version="${INPUT_VERSION:-}"
          case "$GITHUB_REF_NAME" in v*) version="${GITHUB_REF_NAME#v}" ;; esac
          [ -n "$version" ] && tags="$tags,ghcr.io/${GITHUB_REPOSITORY}:${version}"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Agent-ready uptime monitoring
            org.opencontainers.image.licenses=MIT
