# Publishes agent-ready-uptime to npm when a GitHub release tagged v<version> is
# published, through npm trusted publishing (OIDC): no npm token is stored anywhere.
# After the first manual publish, add a trusted publisher on npmjs.com for
# geeks-accelerator/agent-ready-uptime, workflow release.yml.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing; only this job gets it
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          check-latest: true
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@12
      - run: npm ci && npm run build
      - name: The release tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          [ "$tag" = "$version" ] || { echo "Release tag v$tag doesn't match package.json version $version"; exit 1; }
      - run: npm publish --access public
